services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onecli
      POSTGRES_PASSWORD: onecli
      POSTGRES_DB: onecli
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "${ONECLI_PG_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onecli"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
    networks:
      - onecli

  app:
    image: ghcr.io/onecli/onecli:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ONECLI_DASHBOARD_PORT:-10254}:10254"
      - "${ONECLI_GATEWAY_PORT:-10255}:10255"
    environment:
      DATABASE_URL: postgresql://onecli:onecli@postgres:5432/onecli
    volumes:
      - app-data:/app/data
    networks:
      - onecli

volumes:
  pgdata:
  app-data:

networks:
  onecli:
    driver: bridge
